# Site lists - add new sites here; null means "use all sites found in targets"
sites:
  coastal: ["1"]
  urban: null

# S3 connection
s3_bucket_read: "bu4cast-ci-read"
s3_bucket_write: "bu4cast-ci-write"
endpoint: "https://minio-s3.apps.shift.nerc.mghpcc.org"
project_id: "bu4cast"

# Paths
targets_path: "challenges/project_id=bu4cast/targets"
targets_corrected_path: "challenges/project_id=bu4cast/targets/coastal-targets-corrected.csv"
forecasts_path: "challenges/project_id=bu4cast/submissions"
local_forecasts_dir: "/projectnb/dietzelab/cwebb16/FRP/Forecasts"

# Forecast horizons
horizon_P1D: 30
horizon_PT1H: 48

# Theme variables
theme_vars:
  coastal: ["chlora_buoy", "chlora_cci"]
  urban: ["NO2_P1H", "O3", "PM2.5_P1D", "PM10_P1D", "PM2.5_P1H", "PM10_P1H"]

# Source modes for each theme
source_modes:
  coastal: ["buoy", "cci", "cci_corrected"]
  urban: ["urban"]

# Backfill window
backfill_days: 320
backfill_start: "2025-07-01"

# Models
models:
  tg_arima:
    model_id: "tg_arima"
    model_themes: ["coastal", "urban"]
  tg_temp_lm:
    model_id: "tg_temp_lm"
    model_themes: ["coastal", "urban"]
  tg_xgboost:
    model_id: "tg_XGBoost"
    model_themes: ["coastal", "urban"]
  tg_dgam:
    model_id: "tg_dgam"
    model_themes: ["coastal", "urban"]
  tg_randfor:
    model_id: "tg_randfor"
    model_themes: ["coastal", "urban"]
  tg_lm_all:
    model_id: "tg_lm_all"
    model_themes: ["coastal", "urban"]
  tg_lm_scale:
    model_id: "tg_lm_scale"
    model_themes: ["coastal", "urban"]
  tg_dlwrf_lm:
    model_id: "tg_dlwrf_lm"
    model_themes: ["coastal", "urban"]
  tg_dswrf_lm:
    model_id: "tg_dswrf_lm"
    model_themes: ["coastal", "urban"]
  tg_ugrd_lm:
    model_id: "tg_ugrd_lm"
    model_themes: ["coastal", "urban"]
  tg_vgrd_lm:
    model_id: "tg_vgrd_lm"
