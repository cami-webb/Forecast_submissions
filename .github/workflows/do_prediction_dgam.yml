name: Dynamic GAM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: eco4cast/rocker-neon4cast
    env:
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OSN_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSN_SECRET }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install R packages
        run: R -e 'source("install.R")'
      - name: Run automatic prediction file (tg_dgam)
        run: Rscript ./Generate_forecasts/tg_dgam/run_forecast.R
      - name: Back fill forecasts
        run: Rscript ./Generate_forecasts/tg_dgam/rerun_forecasts.R
